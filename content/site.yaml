# One string per paragraph.
about:
  - >
    Hi, I'm Edison, but you can call me Eddie! I'm a second-year Computer 
    Science student at the University of Waterloo, looking for my second co-op.
    I lead the software subteam at UW Orbital, where we build ground station
    applications for our 6U satellite, from telemetry processing pipelines to 
    fullstack mission control software. I most recently interned at the Government of
    Ontario building a Playwright automation framework for CI/CD, simulating critical 
    financial workflows and organizational processes.
  - >
    Outside of that I work on personal projects, shipping developer tools and AI applications.
    Currently, I'm working on building my homelab, a 3-node Kubernetes cluster, to deploy my
    projects, self-host useful applications, and develop DevOps experience. In total, my setup
    saves me over $1000/mo in cloud cost avoidance. 

